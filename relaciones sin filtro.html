<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Headlines</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: Georgia, serif; 
  background: #1a1a1a; 
  color: white;
  padding: 10px;
}
h1 { text-align: center; margin: 10px 0; font-size: 18px; color: #d4af37; }
.config-panel {
  background: #2a2a2a;
  border: 2px solid #d4af37;
  border-radius: 10px;
  padding: 15px;
  margin: 15px auto;
  max-width: 960px;
}
.config-panel label {
  display: block;
  margin: 10px 0 5px;
  color: #d4af37;
  font-weight: bold;
  font-size: 14px;
}
.config-panel input {
  width: 100%;
  padding: 10px;
  border: 1px solid #d4af37;
  border-radius: 5px;
  background: #1a1a1a;
  color: white;
  font-size: 14px;
}
.config-panel button {
  width: 100%;
  margin-top: 15px;
  background: #d4af37;
  color: #000;
  border: none;
  padding: 12px;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
}
.config-panel button:hover { background: #e5c158; }
.controls { 
  text-align: center; 
  margin: 15px 0;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
button {
  background: #d4af37;
  color: #000;
  border: none;
  padding: 12px 20px;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
}
button:hover { background: #e5c158; }
button:disabled { 
  background: #666; 
  cursor: not-allowed; 
}
.counter { 
  text-align: center; 
  margin: 10px 0;
  font-size: 16px;
  color: #d4af37;
}
.slide-container {
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  aspect-ratio: 960/720;
  position: relative;
  background: #000;
  overflow: hidden;
  border: 2px solid #d4af37;
}
.fondo {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: url('https://lh3.googleusercontent.com/d/1q-iXsH2VlWh3NASKj9l6Di_DfQTogLcZ');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.55);
}
.content {
  position: relative;
  z-index: 2;
  padding: 5%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.headline {
  font-size: 4vw;
  font-weight: bold;
  color: #fff;
  line-height: 1.3;
  text-align: center;
  max-height: 30%;
  overflow: hidden;
}
.desarrollo {
  font-size: 2.5vw;
  color: #e8e8e8;
  font-style: italic;
  line-height: 1.4;
  text-align: center;
  flex-grow: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2% 0;
}
.hashtags {
  font-size: 2vw;
  color: #d4af37;
  font-weight: bold;
  text-align: center;
  padding: 2% 0;
}
.status {
  text-align: center;
  margin: 10px 0;
  padding: 10px;
  background: #2a2a2a;
  border-radius: 5px;
  color: #d4af37;
  max-width: 960px;
  margin-left: auto;
  margin-right: auto;
}
.progress-bar {
  width: 100%;
  max-width: 960px;
  height: 20px;
  background: #2a2a2a;
  border-radius: 10px;
  margin: 10px auto;
  overflow: hidden;
  display: none;
}
.progress-fill {
  height: 100%;
  background: #d4af37;
  width: 0%;
  transition: width 0.3s;
}
@media (max-width: 600px) {
  .headline { font-size: 18px; }
  .desarrollo { font-size: 14px; }
  .hashtags { font-size: 12px; }
}
</style>
</head>
<body>

<h1>🎨 Generador de Headlines para Facebook</h1>

<div class="config-panel">
  <label for="desde">📍 Desde (número de fila):</label>
  <input type="number" id="desde" value="1" min="1" placeholder="Ej: 1">
  
  <label for="hasta">📍 Hasta (número de fila):</label>
  <input type="number" id="hasta" value="10" min="1" placeholder="Ej: 50">
  
  <button onclick="cargarHeadlines()">🚀 Cargar Headlines</button>
</div>

<div class="controls" id="navControls" style="display:none;">
  <button onclick="prev()">◀ Anterior</button>
  <button onclick="download()"> Descargar PNG</button>
  <button onclick="downloadAll()">📦 Descargar Todos</button>
  <button onclick="next()">Siguiente ▶</button>
</div>

<div class="counter" id="counter" style="display:none;">
  <span id="current">1</span> / <span id="total">0</span>
</div>

<div class="status" id="status">Configura el rango y carga los headlines</div>

<div class="progress-bar" id="progressBar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div class="slide-container" id="slide" style="display:none;">
  <div class="fondo"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="headline" id="headline"></div>
    <div class="desarrollo" id="desarrollo"></div>
    <div class="hashtags" id="hashtags"></div>
  </div>
</div>

<script>
// URL de tu Google Sheet publicada como CSV
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1RTUaL6rBkl_Z1Plh1CQqZvCTcDRCw564Cdfh2eGkORw/export?format=csv&gid=1281492924';

let headlines = [];
let current = 0;

// Parser CSV robusto (maneja comillas y comas dentro de campos)
function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let inQuotes = false;
  
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];
    
    if (inQuotes) {
      if (char === '"' && next === '"') {
        cell += '"';
        i++;
      } else if (char === '"') {
        inQuotes = false;
      } else {
        cell += char;
      }
    } else {
      if (char === '"') {
        inQuotes = true;
      } else if (char === ',') {
        row.push(cell);
        cell = '';
      } else if (char === '\n' || char === '\r') {
        if (char === '\r' && next === '\n') i++;
        row.push(cell);
        if (row.some(c => c.trim())) rows.push(row);
        row = [];
        cell = '';
      } else {
        cell += char;
      }
    }
  }
  if (cell || row.length) {
    row.push(cell);
    if (row.some(c => c.trim())) rows.push(row);
  }
  return rows;
}

async function cargarHeadlines() {
  const desde = parseInt(document.getElementById('desde').value) - 1;
  const hasta = parseInt(document.getElementById('hasta').value);
  
  document.getElementById('status').textContent = '⏳ Cargando headlines desde tu sheet...';
  document.getElementById('progressBar').style.display = 'block';
  document.getElementById('progressFill').style.width = '20%';
  
  try {
    const response = await fetch(SHEET_URL);
    
    if (!response.ok) {
      throw new Error('No se pudo acceder al sheet. ¿Lo publicaste como CSV?');
    }
    
    const csvText = await response.text();
    const rows = parseCSV(csvText);
    
    document.getElementById('progressFill').style.width = '50%';
    
    headlines = [];
    // rows[0] es el encabezado, los datos empiezan en rows[1]
    for (let i = desde + 1; i <= hasta && i < rows.length; i++) {
      const row = rows[i];
      if (row.length >= 2 && row[0].trim()) {
        const headline = row[0].trim();
        const desarrollo = row[1].trim();
        
        // Extraer hashtags
        const hashtags = desarrollo.match(/#[A-Za-zÁÉÍÓÚáéíóúÑñ0-9_]+/g) || [];
        const textoPrincipal = desarrollo.replace(/#[A-Za-zÁÉÍÓÚáéíóúÑñ0-9_]+/g, '').replace(/\s+/g, ' ').trim();
        const hashtagsString = hashtags.join(' ');
        
        headlines.push({
          h: headline,
          d: textoPrincipal,
          tags: hashtagsString
        });
      }
    }
    
    document.getElementById('progressFill').style.width = '100%';
    
    if (headlines.length > 0) {
      document.getElementById('navControls').style.display = 'flex';
      document.getElementById('counter').style.display = 'block';
      document.getElementById('slide').style.display = 'block';
      document.getElementById('total').textContent = headlines.length;
      document.getElementById('status').textContent = `✅ ${headlines.length} headlines cargados (filas ${desde + 1} a ${hasta})`;
      current = 0;
      show(0);
    } else {
      document.getElementById('status').textContent = ' No se encontraron headlines en ese rango. Verifica los números de fila.';
    }
  } catch (error) {
    document.getElementById('status').textContent = '❌ Error: ' + error.message + '. Asegúrate de publicar el sheet: Archivo → Compartir → Publicar en la web → CSV';
    document.getElementById('progressBar').style.display = 'none';
  }
}

function show(i) {
  document.getElementById('headline').textContent = headlines[i].h;
  document.getElementById('desarrollo').textContent = headlines[i].d;
  document.getElementById('hashtags').textContent = headlines[i].tags;
  document.getElementById('current').textContent = i + 1;
}

function next() {
  current = (current + 1) % headlines.length;
  show(current);
}

function prev() {
  current = (current - 1 + headlines.length) % headlines.length;
  show(current);
}

function download() {
  const slide = document.getElementById('slide');
  html2canvas(slide, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#000',
    allowTaint: true
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = `Headline_${current + 1}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

async function downloadAll() {
  if (!confirm(`¿Descargar ${headlines.length} imágenes? El navegador pedirá permiso para cada descarga.`)) return;
  
  document.getElementById('status').textContent = `📦 Preparando ${headlines.length} imágenes...`;
  document.getElementById('progressBar').style.display = 'block';
  
  for (let i = 0; i < headlines.length; i++) {
    show(i);
    await new Promise(resolve => setTimeout(resolve, 300));
    
    const slide = document.getElementById('slide');
    const canvas = await html2canvas(slide, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#000',
      allowTaint: true
    });
    
    const link = document.createElement('a');
    link.download = `Headline_${String(i + 1).padStart(3, '0')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    const percent = Math.round(((i + 1) / headlines.length) * 100);
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('status').textContent = `📦 Descargando ${i + 1}/${headlines.length} (${percent}%)...`;
    
    await new Promise(resolve => setTimeout(resolve, 800));
  }
  
  document.getElementById('status').textContent = `✅ ¡${headlines.length} imágenes descargadas! Revisa tu carpeta de descargas.`;
}
</script>

</body>
</html>
